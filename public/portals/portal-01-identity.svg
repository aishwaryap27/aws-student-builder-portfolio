<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="id-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f1f3d" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>
    <linearGradient id="id-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="id-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <pattern id="id-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#id-bg)" />
  <rect width="800" height="500" fill="url(#id-grid)" opacity="0.8" />

  <!-- Outer HUD Boundary & Framing -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 4" />
  <path d="M 25 50 L 25 25 L 50 25 M 750 25 L 775 25 L 775 50 M 775 450 L 775 475 L 750 475 M 50 475 L 25 475 L 25 450" fill="none" stroke="#22d3ee" stroke-width="2.5" />

  <!-- Coordinate Markings -->
  <text x="40" y="52" font-family="monospace" font-size="11" fill="#38bdf8" letter-spacing="2" opacity="0.8">SYS.ID // HUMAN.PROFILE.CORE</text>
  <text x="630" y="52" font-family="monospace" font-size="11" fill="#38bdf8" letter-spacing="2" opacity="0.8">REC.VERIFIED</text>
  <text x="40" y="460" font-family="monospace" font-size="10" fill="#64748b" letter-spacing="1.5">LAT 12.9716° N / LON 77.5946° E</text>
  <text x="655" y="460" font-family="monospace" font-size="10" fill="#f59e0b" letter-spacing="1.5">CGPA: 9.6 // CSE</text>

  <!-- Concentric Biometric Target Reticles -->
  <circle cx="400" cy="240" r="160" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 8" />
  <circle cx="400" cy="240" r="130" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.35" />
  <circle cx="400" cy="240" r="100" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="12 4" />
  <circle cx="400" cy="240" r="70" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Crosshair Guides -->
  <line x1="190" y1="240" x2="310" y2="240" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="490" y1="240" x2="610" y2="240" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="400" y1="70" x2="400" y2="150" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="400" y1="330" x2="400" y2="410" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Holographic Human Silhouette & Neural Mesh -->
  <g transform="translate(400, 235)">
    <!-- Head Contour -->
    <path d="M 0 -75 C 32 -75 48 -55 48 -20 C 48 10 38 40 24 55 C 16 64 8 68 0 68 C -8 68 -16 64 -24 55 C -38 40 -48 10 -48 -20 C -48 -55 -32 -75 0 -75 Z"
          fill="none" stroke="url(#id-cyan)" stroke-width="2.5" stroke-opacity="0.85" />
    
    <!-- Torso / Shoulders Archetype -->
    <path d="M -24 55 C -40 68 -70 82 -95 105 C -105 114 -110 125 -115 140 L 115 140 C 110 125 105 114 95 105 C 70 82 40 68 24 55"
