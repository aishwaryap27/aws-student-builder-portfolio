<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="cn-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141424" />
      <stop offset="50%" stop-color="#0b0e1d" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>
    <linearGradient id="cn-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <pattern id="cn-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d2238" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#cn-bg)" />
  <rect width="800" height="500" fill="url(#cn-grid)" opacity="0.8" />

  <!-- Outer HUD Boundary & Framing -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#f97316" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 3" />
  <path d="M 25 50 L 25 25 L 50 25 M 750 25 L 775 25 L 775 50 M 775 450 L 775 475 L 750 475 M 50 475 L 25 475 L 25 450" fill="none" stroke="#f97316" stroke-width="2.5" />

  <!-- Header & Telemetry -->
  <text x="40" y="52" font-family="monospace" font-size="11" fill="#f97316" letter-spacing="2" opacity="0.9">SYS.COMMS // TELEMETRY.DISPATCH</text>
  <text x="630" y="52" font-family="monospace" font-size="11" fill="#38bdf8" letter-spacing="2" opacity="0.9">CHANNELS: ONLINE</text>
  <text x="40" y="460" font-family="monospace" font-size="10" fill="#94a3b8" letter-spacing="1.5">TRANSMISSION FREQ: 2.4 / 5.0 GHz // ENCRYPTED</text>
  <text x="635" y="460" font-family="monospace" font-size="10" fill="#22c55e" letter-spacing="1.5">READY FOR LINK</text>

  <!-- Large Central Communication Ring & Waves -->
  <circle cx="400" cy="245" r="160" fill="none" stroke="#0369a1" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 8" />
  <circle cx="400" cy="245" r="130" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.35" />
  <circle cx="400" cy="245" r="100" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4" stroke-opacity="0.5" />
  <circle cx="400" cy="245" r="70" fill="none" stroke="#f97316" stroke-width="1.8" stroke-opacity="0.7" />

  <!-- Central Transmitter Core -->
  <circle cx="400" cy="245" r="38" fill="#131428" stroke="url(#cn-gradient)" stroke-width="2.5" />
  <circle cx="400" cy="245" r="14" fill="#f97316" />
  <circle cx="400" cy="245" r="6" fill="#fef08a" />

  <!-- Concentric Broadcast Radio Waves -->
  <path d="M 330 205 C 300 220 300 270 330 285" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
  <path d="M 290 185 C 250 215 250 275 290 305" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.5" />
  <path d="M 470 205 C 500 220 500 270 470 285" fill="none" stroke="#f97316" stroke-width="2" stroke-opacity="0.8" />
  <path d="M 510 185 C 550 215 550 275 510 305" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Communication Channel Nodes -->
  <!-- Left: Email Node -->
  <g transform="translate(140, 245)">
    <rect x="-60" y="-30" width="120" height="60" rx="4" fill="#0d152a" stroke="#0284c7" stroke-width="1.5" />
    <text x="0" y="-8" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">PRIMARY EMAIL</text>
    <text x="0" y="10" font-family="sans-serif" font-weight="700" font-size="10" fill="#f8fafc" text-anchor="middle">RNSIT INBOX</text>
    <text x="0" y="22" font-family="monospace" font-size="7" fill="#94a3b8" text-anchor="middle">aishwaryapramod23cs@...</text>
    <line x1="60" y1="0" x2="270" y2="0" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5" />
  </g>

  <!-- Right: GitHub & LinkedIn Nodes -->
  <g transform="translate(660, 200)">
    <rect x="-60" y="-24" width="120" height="48" rx="4" fill="#0d152a" stroke="#f97316" stroke-width="1.5" />
    <text x="0" y="-4" font-family="monospace" font-size="9" fill="#f97316" text-anchor="middle">GITHUB</text>
    <text x="0" y="12" font-family="sans-serif" font-weight="700" font-size="11" fill="#f8fafc" text-anchor="middle">@aishwaryap27</text>
    <line x1="-60" y1="0" x2="-230" y2="35" stroke="#f97316" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5" />
  </g>

  <g transform="translate(660, 290)">
    <rect x="-60" y="-24" width="120" height="48" rx="4" fill="#0d152a" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="0" y="-4" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">LINKEDIN</text>
    <text x="0" y="12" font-family="sans-serif" font-weight="700" font-size="11" fill="#f8fafc" text-anchor="middle">aishwarya-pramod</text>
    <line x1="-60" y1="0" x2="-230" y2="-35" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5" />
  </g>
</svg>
