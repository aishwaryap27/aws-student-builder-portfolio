<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="pj-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#181308" />
      <stop offset="50%" stop-color="#0e0d16" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>
    <linearGradient id="pj-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <pattern id="pj-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#332412" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#pj-bg)" />
  <rect width="800" height="500" fill="url(#pj-grid)" opacity="0.8" />

  <!-- Outer HUD Boundary & Framing -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 4" />
  <path d="M 25 50 L 25 25 L 50 25 M 750 25 L 775 25 L 775 50 M 775 450 L 775 475 L 750 475 M 50 475 L 25 475 L 25 450" fill="none" stroke="#f59e0b" stroke-width="2.5" />

  <!-- Header & Telemetry -->
  <text x="40" y="52" font-family="monospace" font-size="11" fill="#f59e0b" letter-spacing="2" opacity="0.9">SYS.LABS // ENGINEERING.HANGAR</text>
  <text x="635" y="52" font-family="monospace" font-size="11" fill="#fbbf24" letter-spacing="2" opacity="0.9">4 ACTIVE CHAMBERS</text>
  <text x="40" y="460" font-family="monospace" font-size="10" fill="#94a3b8" letter-spacing="1.5">PROTOCOLS: MICROSERVICES // DATA PIPELINE // CV // IoT</text>
  <text x="645" y="460" font-family="monospace" font-size="10" fill="#22c55e" letter-spacing="1.5">● RUNTIME READY</text>

  <!-- Central Schematic Blueprint: Architectural System Grid -->
  <g transform="translate(110, 110)">
    <!-- Lab 01: Microservices Architecture Blueprint -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="270" height="120" rx="4" fill="#0f172a" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.2" />
      <rect x="0" y="0" width="270" height="24" fill="#1e1b18" stroke-bottom="#f59e0b" stroke-width="0.5" />
      <text x="12" y="16" font-family="monospace" font-size="9" fill="#f59e0b">CHAMBER 01 // MICROSERVICES</text>
      <!-- Small blocks inside -->
      <rect x="15" y="40" width="65" height="40" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="47" y="58" font-family="sans-serif" font-size="8" fill="#f8fafc" text-anchor="middle" font-weight="600">Product</text>
      <text x="47" y="70" font-family="monospace" font-size="7" fill="#38bdf8" text-anchor="middle">Port: 8081</text>

      <rect x="100" y="40" width="65" height="40" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="132" y="58" font-family="sans-serif" font-size="8" fill="#f8fafc" text-anchor="middle" font-weight="600">Order</text>
      <text x="132" y="70" font-family="monospace" font-size="7" fill="#38bdf8" text-anchor="middle">Port: 8082</text>

      <rect x="185" y="40" width="65" height="40" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="217" y="58" font-family="sans-serif" font-size="8" fill="#f8fafc" text-anchor="middle" font-weight="600">User</text>
      <text x="217" y="70" font-family="monospace" font-size="7" fill="#38bdf8" text-anchor="middle">Port: 8083</text>

      <!-- Gateway & Eureka bar -->
      <line x1="15" y1="95" x2="250" y2="95" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 2" />
      <text x="135" y="108" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">API GATEWAY + EUREKA DISCOVERY</text>
    </g>

    <!-- Lab 02: CSV Data Processing Pipeline -->
    <g transform="translate(310, 0)">
      <rect x="0" y="0" width="270" height="120" rx="4" fill="#0f172a" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.2" />
      <rect x="0" y="0" width="270" height="24" fill="#1e1b18" />
      <text x="12" y="16" font-family="monospace" font-size="9" fill="#f59e0b">CHAMBER 02 // CSV PIPELINE</text>
      <!-- Pipeline stages -->
      <path d="M 20 65 L 60 65 L 75 50 L 115 50 L 130 65 L 175 65 L 190 80 L 245 80" fill="none" stroke="#38bdf8" stroke-width="1.8" />
      <circle cx="20" cy="65" r="4" fill="#fbbf24" />
      <circle cx="75" cy="50" r="4" fill="#22d3ee" />
      <circle cx="130" cy="65" r="4" fill="#38bdf8" />
      <circle cx="190" cy="80" r="4" fill="#f59e0b" />
      <circle cx="245" cy="80" r="4" fill="#22c55e" />
      <text x="20" y="82" font-family="monospace" font-size="7" fill="#94a3b8">RAW</text>
      <text x="75" y="38" font-family="monospace" font-size="7" fill="#94a3b8">ANALYSIS</text>
      <text x="130" y="52" font-family="monospace" font-size="7" fill="#94a3b8">VALIDATE</text>
      <text x="190" y="98" font-family="monospace" font-size="7" fill="#94a3b8">CLEAN</text>
      <text x="245" y="98" font-family="monospace" font-size="7" fill="#22c55e">OUTPUT</text>
      <text x="135" y="112" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">FASTAPI // DOCKERIZED ENGINE</text>
    </g>

    <!-- Lab 03: Facial Behavior Analysis & Monitoring -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="270" height="120" rx="4" fill="#0f172a" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.2" />
      <rect x="0" y="0" width="270" height="24" fill="#1e1b18" />
      <text x="12" y="16" font-family="monospace" font-size="9" fill="#f59e0b">CHAMBER 03 // FACIAL CV VISION</text>
      <!-- Facial mesh schematic -->
      <circle cx="60" cy="72" r="32" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="2 3" />
      <!-- Eyes points EAR -->
      <ellipse cx="48" cy="68" rx="6" ry="3" fill="none" stroke="#22d3ee" stroke-width="1.2" />
      <ellipse cx="72" cy="68" rx="6" ry="3" fill="none" stroke="#22d3ee" stroke-width="1.2" />
      <circle cx="48" cy="68" r="1.5" fill="#f59e0b" />
      <circle cx="72" cy="68" r="1.5" fill="#f59e0b" />
      <ellipse cx="60" cy="85" rx="8" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.2" />
      <!-- Metrics readout -->
      <text x="110" y="58" font-family="monospace" font-size="9" fill="#38bdf8">EAR: 0.32 [ALERT: NORMAL]</text>
      <text x="110" y="74" font-family="monospace" font-size="9" fill="#38bdf8">MAR: 0.18 [YAWN: NEGATIVE]</text>
      <text x="110" y="90" font-family="monospace" font-size="9" fill="#22c55e">STATUS: NOMINAL (TEMPORAL)</text>
      <text x="135" y="112" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">MEDIAPIPE + OPENCV PIPELINE</text>
    </g>

    <!-- Lab 04: EcoBand Smart IoT Waste System -->
    <g transform="translate(310, 140)">
      <rect x="0" y="0" width="270" height="120" rx="4" fill="#0f172a" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.2" />
      <rect x="0" y="0" width="270" height="24" fill="#1e1b18" />
      <text x="12" y="16" font-family="monospace" font-size="9" fill="#f59e0b">CHAMBER 04 // ECOBAND IoT</text>
      <!-- IoT Bin + Sensor Telemetry Schematic -->
      <rect x="25" y="45" width="45" height="55" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <!-- Ultrasonic wave emission -->
      <path d="M 47 48 C 42 42 52 42 47 36" fill="none" stroke="#22d3ee" stroke-width="1" />
      <text x="32" y="75" font-family="monospace" font-size="8" fill="#fbbf24">BAND</text>
      <!-- Telemetry text -->
      <text x="90" y="58" font-family="monospace" font-size="9" fill="#fbbf24">ULTRASONIC: 74% FILL</text>
      <text x="90" y="74" font-family="monospace" font-size="9" fill="#38bdf8">LOAD CELL: 14.2 KG</text>
      <text x="90" y="90" font-family="monospace" font-size="9" fill="#f59e0b">CALORIFIC ESTIMATION</text>
      <text x="135" y="112" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">IEEE SASIGD 2026 PRESENTATION</text>
    </g>
  </g>
</svg>
