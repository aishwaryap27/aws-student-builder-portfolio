    <!-- Biometric Wireframe Facial Grid -->
    <ellipse cx="0" cy="-20" rx="36" ry="46" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2 4" />
    <ellipse cx="0" cy="-20" rx="20" ry="32" fill="none" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="-36" y1="-20" x2="36" y2="-20" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.7" />
    <line x1="-28" y1="-38" x2="28" y2="-38" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="-24" y1="2" x2="24" y2="2" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="0" y1="-65" x2="0" y2="25" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />

    <!-- Neural Constellation Pips -->
    <circle cx="-16" cy="-28" r="3" fill="#fbbf24" />
    <circle cx="16" cy="-28" r="3" fill="#fbbf24" />
    <circle cx="0" cy="-10" r="2.5" fill="#22d3ee" />
    <circle cx="0" cy="12" r="3" fill="#38bdf8" />
    <circle cx="-28" cy="8" r="2" fill="#22d3ee" />
    <circle cx="28" cy="8" r="2" fill="#22d3ee" />

    <!-- Scanning HUD Line -->
    <line x1="-80" y1="-12" x2="80" y2="-12" stroke="#f59e0b" stroke-width="1.8" stroke-opacity="0.9" />
    <circle cx="-80" cy="-12" r="3" fill="#f59e0b" />
    <circle cx="80" cy="-12" r="3" fill="#f59e0b" />
  </g>

  <!-- Lateral Data Readouts & Metric Brackets -->
  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="120" height="42" fill="#0c172e" fill-opacity="0.7" stroke="#0284c7" stroke-width="1" />
    <text x="10" y="16" font-family="monospace" font-size="9" fill="#94a3b8">ACADEMIC STATUS</text>
    <text x="10" y="32" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">BE · CSE 2027</text>
    <line x1="120" y1="21" x2="160" y2="21" stroke="#0284c7" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="160" cy="21" r="2" fill="#38bdf8" />
  </g>

  <g transform="translate(90, 260)">
    <rect x="0" y="0" width="120" height="42" fill="#0c172e" fill-opacity="0.7" stroke="#0284c7" stroke-width="1" />
    <text x="10" y="16" font-family="monospace" font-size="9" fill="#94a3b8">DISTINCTION</text>
    <text x="10" y="32" font-family="sans-serif" font-weight="700" font-size="14" fill="#fbbf24">BRANCH TOPPER</text>
    <line x1="120" y1="21" x2="160" y2="21" stroke="#0284c7" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="160" cy="21" r="2" fill="#fbbf24" />
  </g>

  <g transform="translate(590, 160)">
    <rect x="0" y="0" width="120" height="42" fill="#0c172e" fill-opacity="0.7" stroke="#0284c7" stroke-width="1" />
    <text x="10" y="16" font-family="monospace" font-size="9" fill="#94a3b8">CORE DOMAIN</text>
    <text x="10" y="32" font-family="sans-serif" font-weight="700" font-size="13" fill="#22d3ee">BACKEND &amp; IoT</text>
    <line x1="0" y1="21" x2="-40" y2="21" stroke="#0284c7" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="-40" cy="21" r="2" fill="#22d3ee" />
  </g>

  <g transform="translate(590, 260)">
    <rect x="0" y="0" width="120" height="42" fill="#0c172e" fill-opacity="0.7" stroke="#0284c7" stroke-width="1" />
    <text x="10" y="16" font-family="monospace" font-size="9" fill="#94a3b8">IDENTITY NODE</text>
    <text x="10" y="32" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">AISHWARYA.EXE</text>
    <line x1="0" y1="21" x2="-40" y2="21" stroke="#0284c7" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="-40" cy="21" r="2" fill="#f8fafc" />
  </g>
</svg>
