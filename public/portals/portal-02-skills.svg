<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="sk-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1930" />
      <stop offset="50%" stop-color="#081022" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>
    <linearGradient id="sk-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sk-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <pattern id="sk-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#sk-bg)" />
  <rect width="800" height="500" fill="url(#sk-grid)" opacity="0.7" />

  <!-- Outer HUD Boundary & Framing -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#0284c7" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 3" />
  <path d="M 25 50 L 25 25 L 50 25 M 750 25 L 775 25 L 775 50 M 775 450 L 775 475 L 750 475 M 50 475 L 25 475 L 25 450" fill="none" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Header & Telemetry -->
  <text x="40" y="52" font-family="monospace" font-size="11" fill="#38bdf8" letter-spacing="2" opacity="0.8">SYS.MATRIX // TECH.CONSTELLATION</text>
  <text x="640" y="52" font-family="monospace" font-size="11" fill="#38bdf8" letter-spacing="2" opacity="0.8">NODES: 6 DOMAINS</text>
  <text x="40" y="460" font-family="monospace" font-size="10" fill="#64748b" letter-spacing="1.5">CIRCUIT ARCH: DISTRIBUTED &amp; EMBEDDED</text>
  <text x="660" y="460" font-family="monospace" font-size="10" fill="#fbbf24" letter-spacing="1.5">STACK ONLINE</text>

  <!-- Circuit Board Traces & Bus Lines -->
  <path d="M 120 120 L 220 120 L 270 170 L 380 170" fill="none" stroke="#0369a1" stroke-width="1.8" stroke-opacity="0.6" />
  <path d="M 120 380 L 220 380 L 270 330 L 380 330" fill="none" stroke="#0369a1" stroke-width="1.8" stroke-opacity="0.6" />
  <path d="M 680 120 L 580 120 L 530 170 L 420 170" fill="none" stroke="#0369a1" stroke-width="1.8" stroke-opacity="0.6" />
  <path d="M 680 380 L 580 380 L 530 330 L 420 330" fill="none" stroke="#0369a1" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- Primary Circuit Bus Lines Connecting Center Hub -->
  <line x1="400" y1="120" x2="400" y2="380" stroke="#0284c7" stroke-width="2" stroke-opacity="0.4" />
  <line x1="240" y1="250" x2="560" y2="250" stroke="#0284c7" stroke-width="2" stroke-opacity="0.4" />

  <!-- Diagonal Linkages -->
  <line x1="280" y1="170" x2="400" y2="250" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="3 3" />
  <line x1="520" y1="170" x2="400" y2="250" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="3 3" />
  <line x1="280" y1="330" x2="400" y2="250" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="3 3" />
  <line x1="520" y1="330" x2="400" y2="250" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="3 3" />

  <!-- Center Hub: Core Engine -->
  <circle cx="400" cy="250" r="54" fill="#0b172e" stroke="url(#sk-cyan)" stroke-width="2.5" />
  <circle cx="400" cy="250" r="42" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.8" />
  <circle cx="400" cy="250" r="14" fill="url(#sk-amber)" />
  <text x="400" y="254" font-family="monospace" font-weight="700" font-size="9" fill="#060913" text-anchor="middle">CORE</text>

  <!-- Node 1: Java & Spring Boot (Backend Hub) -->
  <g transform="translate(280, 170)">
    <circle cx="0" cy="0" r="32" fill="#0c1d3b" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#22d3ee" stroke-width="0.8" stroke-dasharray="2 3" />
    <text x="0" y="-4" font-family="sans-serif" font-weight="700" font-size="10" fill="#f8fafc" text-anchor="middle">SPRING</text>
    <text x="0" y="9" font-family="monospace" font-size="8" fill="#38bdf8" text-anchor="middle">BOOT // JAVA</text>
    <circle cx="0" cy="0" r="4" fill="#38bdf8" opacity="0.3" />
  </g>

  <!-- Node 2: Python & Fast API -->
  <g transform="translate(520, 170)">
    <circle cx="0" cy="0" r="32" fill="#0c1d3b" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#22d3ee" stroke-width="0.8" stroke-dasharray="2 3" />
    <text x="0" y="-4" font-family="sans-serif" font-weight="700" font-size="10" fill="#f8fafc" text-anchor="middle">PYTHON</text>
    <text x="0" y="9" font-family="monospace" font-size="8" fill="#38bdf8" text-anchor="middle">FASTAPI // CV</text>
  </g>

  <!-- Node 3: IoT Hardware (ESP32) -->
  <g transform="translate(280, 330)">
    <circle cx="0" cy="0" r="32" fill="#0c1d3b" stroke="#f59e0b" stroke-width="2" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2 3" />
    <text x="0" y="-4" font-family="sans-serif" font-weight="700" font-size="10" fill="#f8fafc" text-anchor="middle">IoT HW</text>
    <text x="0" y="9" font-family="monospace" font-size="8" fill="#fbbf24" text-anchor="middle">ESP32 // SENS</text>
  </g>

  <!-- Node 4: MySQL & Hibernate -->
  <g transform="translate(520, 330)">
    <circle cx="0" cy="0" r="32" fill="#0c1d3b" stroke="#f59e0b" stroke-width="2" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2 3" />
    <text x="0" y="-4" font-family="sans-serif" font-weight="700" font-size="10" fill="#f8fafc" text-anchor="middle">DATABASE</text>
    <text x="0" y="9" font-family="monospace" font-size="8" fill="#fbbf24" text-anchor="middle">MYSQL // JPA</text>
  </g>

  <!-- Node 5: Cloud & Microservices (Top) -->
  <g transform="translate(400, 105)">
    <rect x="-42" y="-18" width="84" height="36" rx="4" fill="#0c172e" stroke="#22d3ee" stroke-width="1.5" />
    <text x="0" y="-2" font-family="sans-serif" font-weight="700" font-size="9" fill="#f8fafc" text-anchor="middle">MICROSERVICES</text>
    <text x="0" y="10" font-family="monospace" font-size="8" fill="#38bdf8" text-anchor="middle">EUREKA // GATEWAY</text>
  </g>

  <!-- Node 6: Tools & Containers (Bottom) -->
  <g transform="translate(400, 395)">
    <rect x="-42" y="-18" width="84" height="36" rx="4" fill="#0c172e" stroke="#22d3ee" stroke-width="1.5" />
    <text x="0" y="-2" font-family="sans-serif" font-weight="700" font-size="9" fill="#f8fafc" text-anchor="middle">DEVOPS TOOLS</text>
    <text x="0" y="10" font-family="monospace" font-size="8" fill="#38bdf8" text-anchor="middle">DOCKER // GIT // VERCEL</text>
  </g>

  <!-- Pulse Signals on Lines -->
  <circle cx="250" cy="170" r="3" fill="#22d3ee" />
  <circle cx="550" cy="170" r="3" fill="#22d3ee" />
  <circle cx="250" cy="330" r="3" fill="#f59e0b" />
  <circle cx="550" cy="330" r="3" fill="#f59e0b" />
</svg>
